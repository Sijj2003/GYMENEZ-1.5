<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | Planes de Suscripción</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030305; color: white;}
        
        /* Glassmorphism Pro */
        .premium-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Menú Horizontal */
        .plan-tab {
            transition: all 0.3s ease;
            position: relative;
        }
        .plan-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: currentColor;
            border-radius: 2px;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Glow animations */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col">

    <div id="loading-overlay" class="fixed inset-0 z-50 bg-[#030305] flex flex-col items-center justify-center transition-all duration-700">
        <div class="relative w-12 h-12">
            <div class="absolute inset-0 border-2 border-white/5 rounded-full"></div>
            <div class="absolute inset-0 border-2 border-[#FFC300] rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p class="mt-4 text-[10px] font-bold uppercase tracking-[0.4em] text-white/40">Sincronizando Ecosistema</p>
    </div>

    <header class="w-full border-b border-white/5 bg-[#030305]/60 backdrop-blur-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 md:py-6 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black uppercase tracking-tighter"><span class="text-[#FFC300]">GYM</span>ENEZ</h1>
            <a href="../apps/start/inicio.html" class="text-[10px] md:text-xs font-bold uppercase tracking-widest px-5 py-2 rounded-full border border-white/10 hover:bg-white/5 transition-all">Volver</a>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center px-4 py-10 md:py-16 w-full max-w-5xl mx-auto reveal opacity-0">
        
        <div class="text-center mb-8 md:mb-12">
            <span class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mb-2 block">Suscripción y Mejoras</span>
            <h2 class="text-3xl md:text-5xl font-black tracking-tighter leading-tight uppercase italic">
                Niveles de <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-300 to-gray-500">Optimización</span>
            </h2>
            
            <div class="mt-4 inline-flex items-center gap-3 px-4 py-2 rounded-full bg-white/[0.03] border border-white/10 shadow-inner">
                <span class="flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <p class="text-[9px] md:text-[10px] font-semibold text-gray-400 tracking-wide uppercase">Tasa Oficial BCV: <span id="tasa-bcv-display" class="text-white ml-1 font-bold">Cargando...</span></p>
            </div>
        </div>

        <div class="w-full flex overflow-x-auto no-scrollbar justify-start md:justify-center border-b border-white/10 mb-8 md:mb-12">
            <div class="flex space-x-6 md:space-x-12 px-4 pb-2">
                <button onclick="selectPlan('BASICO')" id="tab-BASICO" class="plan-tab text-gray-500 hover:text-gray-300 font-black uppercase tracking-widest text-xs md:text-sm py-2">Básico</button>
                <button onclick="selectPlan('STANDARD')" id="tab-STANDARD" class="plan-tab text-gray-500 hover:text-gray-300 font-black uppercase tracking-widest text-xs md:text-sm py-2">Standard</button>
                <button onclick="selectPlan('PLUS')" id="tab-PLUS" class="plan-tab text-gray-500 hover:text-gray-300 font-black uppercase tracking-widest text-xs md:text-sm py-2">Plus</button>
                <button onclick="selectPlan('ULTRA')" id="tab-ULTRA" class="plan-tab text-gray-500 hover:text-gray-300 font-black uppercase tracking-widest text-xs md:text-sm py-2">Ultra</button>
            </div>
        </div>

        <div id="plan-card" class="premium-card w-full rounded-[2rem] p-6 md:p-10 flex flex-col shadow-2xl relative overflow-hidden transition-all duration-500">
            <div id="plan-glow" class="absolute -top-20 -right-20 w-64 h-64 blur-[80px] rounded-full opacity-20 pointer-events-none transition-colors duration-500"></div>
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 border-b border-white/5 pb-8 relative z-10">
                <div>
                    <span id="plan-tag" class="text-[9px] font-black uppercase tracking-[0.2em] px-3 py-1 rounded-full border mb-3 inline-block transition-colors duration-300">...</span>
                    <h3 id="plan-name" class="text-3xl md:text-4xl font-black italic tracking-tighter uppercase transition-colors duration-300">...</h3>
                    <p id="plan-current-badge" class="hidden mt-2 text-[10px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded w-max border border-emerald-400/20">Tu Plan Actual</p>
                </div>
                
                <div class="text-left md:text-right">
                    <div class="flex items-baseline gap-1 justify-start md:justify-end">
                        <span class="text-xl font-medium text-gray-400">$</span>
                        <span id="plan-price-usd" class="text-5xl font-black tracking-tighter">...</span>
                        <span class="text-xl font-bold text-gray-400">/mes</span>
                    </div>
                    <p class="text-[10px] font-bold text-gray-400 mt-2 uppercase tracking-widest">Bs. <span id="plan-price-bs">...</span></p>
                    
                    <button id="action-btn" class="mt-4 w-full md:w-auto px-8 py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all transform active:scale-95 shadow-xl">
                        Cargando...
                    </button>
                </div>
            </div>

            <div class="relative z-10">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Características del Plan</h4>
                <div id="features-list" class="space-y-3">
                    </div>
            </div>
        </div>

        <p class="mt-16 text-gray-600 text-[8px] md:text-[9px] uppercase tracking-[0.3em] font-bold text-center">Gimenez Ecosystem &copy; 2026 • Modificación de planes instantánea</p>
    </main>

    <script>
        const API_URL = "https://sijj2003.pythonanywhere.com";
        let tasaBcvActual = 0;
        let currentUserPlan = 'BASICO'; 
        let currentUserId = null;
        let activeTab = 'PLUS'; 

        const plansData = {
            'BASICO': {
                id: 'BASICO',
                name: 'BÁSICO',
                priceUSD: 0.00,
                tag: 'Acceso Light',
                colorClass: 'text-gray-300',
                bgClass: 'bg-gray-400',
                borderClass: 'border-gray-500',
                glowClass: 'bg-gray-500',
                btnClass: 'bg-gray-200 text-black hover:bg-white',
                features: [
                    { name: 'Plan de Entrenamiento', value: 'Automatizado', icon: 'check', color: 'text-gray-300' },
                    { name: 'Comunicación con Entrenador', value: 'No disponible', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Histórico de Métricas', value: 'No disponible', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Plataforma GYMENEZ ON', value: 'Restringido', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Nutrición GYMENEZ EATS', value: 'Restringido', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Prioridad de Soporte', value: 'Nula', icon: 'info', color: 'text-gray-500' }
                ]
            },
            'STANDARD': {
                id: 'STANDARD',
                name: 'STANDARD',
                priceUSD: 13.99,
                tag: 'Dirección Básica',
                colorClass: 'text-white',
                bgClass: 'bg-white',
                borderClass: 'border-white/50',
                glowClass: 'bg-white',
                btnClass: 'bg-white text-black hover:bg-gray-200 shadow-white/20',
                features: [
                    { name: 'Plan de Entrenamiento', value: '100% Personalizado', icon: 'check', color: 'text-white' },
                    { name: 'Comunicación con Entrenador', value: 'Continua', icon: 'check', color: 'text-white' },
                    { name: 'Histórico de Métricas', value: 'No disponible', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Plataforma GYMENEZ ON', value: 'Restringido', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Nutrición GYMENEZ EATS', value: 'Restringido', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Prioridad de Soporte', value: 'Baja', icon: 'info', color: 'text-gray-400' }
                ]
            },
            'PLUS': {
                id: 'PLUS',
                name: 'PLUS',
                priceUSD: 17.99,
                tag: 'Control Analítico',
                colorClass: 'text-[#FFC300]',
                bgClass: 'bg-[#FFC300]',
                borderClass: 'border-[#FFC300]/50',
                glowClass: 'bg-[#FFC300]',
                btnClass: 'bg-[#FFC300] text-black hover:bg-[#FFD700] shadow-[#FFC300]/20',
                features: [
                    { name: 'Plan de Entrenamiento', value: '100% Personalizado', icon: 'check', color: 'text-[#FFC300]' },
                    { name: 'Comunicación con Entrenador', value: 'Continua', icon: 'check', color: 'text-[#FFC300]' },
                    { name: 'Histórico de Métricas', value: 'Simétricas y Avanzadas', icon: 'check', color: 'text-[#FFC300]' },
                    { name: 'Plataforma GYMENEZ ON', value: 'Catálogo Seleccionado', icon: 'check', color: 'text-[#FFC300]' },
                    { name: 'Nutrición GYMENEZ EATS', value: 'Restringido', icon: 'cross', color: 'text-gray-600' },
                    { name: 'Prioridad de Soporte', value: 'Media', icon: 'info', color: 'text-gray-300' }
                ]
            },
            'ULTRA': {
                id: 'ULTRA',
                name: 'ULTRA',
                priceUSD: 27.99,
                tag: 'Ecosistema 360°',
                colorClass: 'text-sky-400',
                bgClass: 'bg-sky-400',
                borderClass: 'border-sky-400/50',
                glowClass: 'bg-sky-500',
                btnClass: 'bg-sky-500 text-white hover:bg-sky-400 shadow-sky-500/20',
                features: [
                    { name: 'Plan de Entrenamiento', value: 'Personalizado + Ajustes Dinámicos', icon: 'check', color: 'text-sky-400' },
                    { name: 'Comunicación con Entrenador', value: 'VIP Bidireccional', icon: 'check', color: 'text-sky-400' },
                    { name: 'Histórico de Métricas', value: 'Control Total', icon: 'check', color: 'text-sky-400' },
                    { name: 'Plataforma GYMENEZ ON', value: 'Acceso VIP Ilimitado', icon: 'check', color: 'text-sky-400' },
                    { name: 'Nutrición GYMENEZ EATS', value: 'Planificación Bioquímica', icon: 'check', color: 'text-sky-400' },
                    { name: 'Prioridad de Soporte', value: 'Alta / Preferencial', icon: 'info', color: 'text-sky-300' }
                ]
            }
        };

        window.onload = async () => {
            // Verificar Sesión y Perfil
            const storedSession = localStorage.getItem('userSession');
            if (storedSession) {
                try {
                    const user = JSON.parse(storedSession);
                    currentUserId = user.id || user._id;
                    const resProfile = await fetch(`${API_URL}/api/profile/${currentUserId}`);
                    const dataProfile = await resProfile.json();
                    if (dataProfile.success && dataProfile.profile) {
                        currentUserPlan = (dataProfile.profile.subscription_level || 'BASICO').toUpperCase();
                        // Seleccionar por defecto un plan superior al actual si es posible
                        if (currentUserPlan === 'BASICO') activeTab = 'STANDARD';
                        else if (currentUserPlan === 'STANDARD') activeTab = 'PLUS';
                        else if (currentUserPlan === 'PLUS') activeTab = 'ULTRA';
                        else activeTab = 'ULTRA';
                    }
                } catch (e) {
                    console.error("No se pudo obtener el perfil.");
                }
            }

            // Tasa BCV
            try {
                const res = await fetch(`${API_URL}/api/bcv-rate`);
                const data = await res.json();
                if(data.success) {
                    tasaBcvActual = data.rate;
                    document.getElementById('tasa-bcv-display').textContent = `${tasaBcvActual.toFixed(2)} BS`;
                }
            } catch (e) {
                console.warn("Fallo tasa BCV");
            }

            selectPlan(activeTab);

            setTimeout(() => {
                document.getElementById('loading-overlay').classList.add('opacity-0', 'pointer-events-none');
            }, 500);
        };

        function getIconSVG(type, colorClass) {
            if (type === 'check') {
                return `<svg class="w-5 h-5 flex-shrink-0 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else if (type === 'cross') {
                return `<svg class="w-5 h-5 flex-shrink-0 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                return `<svg class="w-5 h-5 flex-shrink-0 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }
        }

        function selectPlan(planId) {
            const data = plansData[planId];
            activeTab = planId;

            // Actualizar Tabs
            Object.keys(plansData).forEach(key => {
                const tab = document.getElementById(`tab-${key}`);
                tab.className = `plan-tab font-black uppercase tracking-widest text-xs md:text-sm py-2 ${key === planId ? plansData[key].colorClass + ' active' : 'text-gray-500 hover:text-gray-300'}`;
            });

            // Actualizar UI de Tarjeta
            const card = document.getElementById('plan-card');
            card.className = `premium-card w-full rounded-[2rem] p-6 md:p-10 flex flex-col shadow-2xl relative overflow-hidden transition-all duration-500 border border-white/5 hover:${data.borderClass}`;
            
            document.getElementById('plan-glow').className = `absolute -top-20 -right-20 w-64 h-64 blur-[80px] rounded-full opacity-10 pointer-events-none transition-colors duration-500 ${data.glowClass}`;
            
            const tag = document.getElementById('plan-tag');
            tag.textContent = data.tag;
            tag.className = `text-[9px] font-black uppercase tracking-[0.2em] px-3 py-1 rounded-full border mb-3 inline-block transition-colors duration-300 ${data.colorClass} ${data.borderClass} ${data.bgClass.replace('bg-', 'bg-opacity-10 bg-')}`;
            
            const name = document.getElementById('plan-name');
            name.textContent = data.name;
            name.className = `text-3xl md:text-4xl font-black italic tracking-tighter uppercase transition-colors duration-300 ${data.colorClass}`;

            const isCurrentPlan = (planId === currentUserPlan);
            document.getElementById('plan-current-badge').classList.toggle('hidden', !isCurrentPlan);

            // Precios
            const priceWhole = Math.floor(data.priceUSD);
            const priceDec = (data.priceUSD % 1).toFixed(2).substring(2);
            document.getElementById('plan-price-usd').innerHTML = `${priceWhole}<span class="text-2xl">.${priceDec}</span>`;
            
            const bsPrice = tasaBcvActual > 0 ? (data.priceUSD * tasaBcvActual).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '...';
            document.getElementById('plan-price-bs').textContent = bsPrice;

            // Botón
            const btn = document.getElementById('action-btn');
            if (isCurrentPlan) {
                btn.textContent = 'Plan Actual Activo';
                btn.className = 'mt-4 w-full md:w-auto px-8 py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all shadow-xl bg-gray-800 text-gray-500 cursor-default border border-white/10';
                btn.onclick = null;
            } else if (data.priceUSD === 0) {
                btn.textContent = 'Incluido Gratis';
                btn.className = 'mt-4 w-full md:w-auto px-8 py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all shadow-xl bg-gray-800 text-gray-400 cursor-default border border-white/10';
                btn.onclick = null;
            } else {
                const actionText = (currentUserPlan === 'BASICO') ? 'Obtener Nivel' : 'Cambiar a Nivel';
                btn.textContent = `${actionText} ${data.name}`;
                btn.className = `mt-4 w-full md:w-auto px-8 py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all transform active:scale-95 shadow-xl ${data.btnClass}`;
                btn.onclick = () => goToPayment(data.id, data.priceUSD);
            }

            // Características
            const list = document.getElementById('features-list');
            list.innerHTML = data.features.map(f => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-black/20 border border-white/5">
                    <div class="flex items-center gap-3">
                        ${getIconSVG(f.icon, f.color)}
                        <span class="text-xs md:text-sm font-medium ${f.icon === 'cross' ? 'text-gray-500 line-through' : 'text-gray-200'}">${f.name}</span>
                    </div>
                    <span class="text-[10px] md:text-xs font-bold uppercase tracking-wider ${f.color} text-right w-1/2 md:w-auto truncate">${f.value}</span>
                </div>
            `).join('');
        }

        function goToPayment(plan, usdPrice) {
            if (!currentUserId) {
                window.location.href = '../apps/start/login.html';
                return;
            }
            if (tasaBcvActual === 0) {
                alert("Error de conexión con el BCV. Intente más tarde.");
                return;
            }
            const bsPrice = (usdPrice * tasaBcvActual).toFixed(2);
            localStorage.setItem('pendingPaymentPlan', plan);
            localStorage.setItem('pendingPaymentBs', bsPrice);
            
            document.querySelector('main').style.opacity = '0';
            document.querySelector('main').style.transform = 'scale(0.98)';
            document.querySelector('main').style.transition = 'all 0.5s ease';
            
            setTimeout(() => {
                window.location.href = 'payments.html';
            }, 500);
        }
    </script>
</body>
</html>
