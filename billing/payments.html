<head>

    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: white;
            overflow-x: hidden;
        }
        
        /* Glassmorphism Pro Coherente - Alto Contraste */
        .premium-card {
            background: linear-gradient(145deg, #111115 0%, #0a0a0c 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .glow-yellow {
            border-color: rgba(255, 195, 0, 0.3);
        }
        .glow-yellow:hover { 
            border-color: rgba(255, 195, 0, 0.8); 
            box-shadow: 0 0 40px rgba(255, 195, 0, 0.2); 
            transform: translateY(-2px);
        }

        /* Inputs Premium Oscuros de Alto Contraste */
        .glass-input {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #FFC300;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 195, 0, 0.25);
            outline: none;
        }

        select.glass-input option {
            background-color: #0a0a0c;
            color: white;
        }

        /* Animaciones */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
