<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Élite | GYMENEZ Asistance</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030305; 
            color: white; 
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar Premium */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 195, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 195, 0, 0.6); }
        
        /* Glass Panels */
        .glass-panel {
            background: rgba(10, 10, 15, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #FFC300;
            box-shadow: 0 0 25px rgba(255, 195, 0, 0.15);
            outline: none;
        }

        /* Animaciones Premium */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-animate { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Cursor de escritura IA */
        .typing-cursor::after {
            content: '▌';
            animation: blink 1s step-start infinite;
            color: #FFC300;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Ocultar scrollbar en el contenedor de mensajes pero permitir scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-[#FFC300] selection:text-black relative">

    <div class="fixed inset-0 bg-[url('/static/img/backgrounds/PROFILE_FONDO.png')] bg-cover bg-center opacity-10 -z-10 mix-blend-screen grayscale pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/60 via-[#030305]/95 to-[#030305] -z-10 pointer-events-none"></div>
    
    <div class="absolute top-1/4 left-1/2 transform -translate-x-1/2 w-[40vw] h-[40vw] bg-[#FFC300]/5 blur-[100px] rounded-full pointer-events-none -z-10"></div>

    <header class="w-full border-b border-white/5 bg-[#030305]/60 backdrop-blur-xl sticky top-0 z-50 flex-shrink-0">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="/apps/start/inicio.html" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-[#FFC300] transition border border-white/5 hover:border-[#FFC300]/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </a>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-[#FFC300] rounded-full animate-pulse shadow-[0_0_10px_#FFC300]"></div>
                    <div>
                        <h1 class="font-black text-sm md:text-base uppercase tracking-widest italic text-white">Copiloto <span class="text-[#FFC300]">IA</span></h1>
                    </div>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-2 text-[10px] text-gray-500 uppercase tracking-[0.2em] font-bold bg-[#111] px-3 py-1.5 rounded-full border border-white/5">
                <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Conexión Segura
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto overflow-y-auto px-4 md:px-8 pt-6 pb-32 flex flex-col relative no-scrollbar" id="chat-container">
        
        <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center mt-4 md:mt-10 msg-animate">
            <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-br from-[#FFC300]/20 to-transparent border border-[#FFC300]/30 rounded-[2rem] rotate-12 flex items-center justify-center shadow-[0_0_50px_rgba(255,195,0,0.15)] mb-8 backdrop-blur-md">
                <svg class="w-10 h-10 md:w-12 md:h-12 text-[#FFC300] -rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            </div>
            <h2 class="text-3xl md:text-5xl font-black uppercase italic mb-3 tracking-tighter text-white drop-shadow-lg">¿En qué puedo <br/><span class="text-[#FFC300]">ayudarte hoy?</span></h2>
            <p class="text-gray-400 max-w-md mx-auto text-xs md:text-sm mb-10 leading-relaxed">Tu Copiloto de Rendimiento está listo. Analizaré tus métricas y resolveré cualquier duda sobre el ecosistema.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-2xl">
                <button class="faq-btn glass-panel text-left p-4 rounded-[20px] hover:border-[#FFC300]/50 hover:bg-white/5 transition-all group shadow-lg flex items-start gap-3">
                    <div class="text-[#FFC300] mt-0.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
                    <div>
                        <div class="text-white font-bold text-xs uppercase tracking-widest mb-1 group-hover:text-[#FFC300] transition-colors">Estado de Plan</div>
                        <div class="text-gray-500 text-[10px] leading-relaxed">¿Qué beneficios incluye mi plan actual y cuáles son mis límites?</div>
                    </div>
                </button>
                <button class="faq-btn glass-panel text-left p-4 rounded-[20px] hover:border-[#FFC300]/50 hover:bg-white/5 transition-all group shadow-lg flex items-start gap-3">
                    <div class="text-[#FFC300] mt-0.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg></div>
                    <div>
                        <div class="text-white font-bold text-xs uppercase tracking-widest mb-1 group-hover:text-[#FFC300] transition-colors">Rutina y Progreso</div>
                        <div class="text-gray-500 text-[10px] leading-relaxed">Ayúdame a entender cómo debo registrar mis ejercicios hoy.</div>
                    </div>
                </button>
            </div>
        </div>

        <div id="chat-messages" class="flex flex-col space-y-6 w-full max-w-4xl mx-auto hidden pb-10">
            </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full p-4 md:p-8 bg-gradient-to-t from-[#030305] via-[#030305]/90 to-transparent z-40 pb-6 md:pb-10">
        <div class="max-w-3xl mx-auto">
            <div class="relative flex items-center glass-input rounded-full p-1.5 shadow-[0_15px_35px_rgba(0,0,0,0.5)]">
                
                <input type="text" id="chat-input" placeholder="Pregúntale a tu Copiloto..." class="w-full bg-transparent text-white placeholder-gray-500 px-5 py-3 md:py-4 outline-none text-xs md:text-sm font-medium">
                
                <button id="btn-send-chat" class="bg-[#FFC300] hover:bg-yellow-400 text-black w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-black transition-transform transform hover:scale-105 active:scale-95 flex-shrink-0 shadow-[0_0_20px_rgba(255,195,0,0.3)]">
                    <svg class="w-4 h-4 md:w-5 md:h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
            <div class="text-center mt-3">
                <p class="text-[8px] md:text-[9px] text-gray-500 uppercase tracking-[0.2em] font-bold">La IA puede cometer errores. Verifica la información importante médica o de pagos.</p>
            </div>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send-chat');
        const faqBtns = document.querySelectorAll('.faq-btn');

        // 🔴 RUTA A TU BACKEND EN PYTHONANYWHERE
        const BACKEND_URL = 'https://sijj2003.pythonanywhere.com/api/soporte-chat';

        // Obtener Token JWT para validación backend
        function getBearerToken() {
            const token = localStorage.getItem('gymen_auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        // Configurar botones FAQ
        faqBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const pregunta = btn.querySelector('div > div:nth-child(2)').innerText.trim();
                enviarMensaje(pregunta);
            });
        });

        async function enviarMensaje(textoFaq = null) {
            const texto = typeof textoFaq === 'string' ? textoFaq : chatInput.value.trim();
            if(!texto) return;

            // 1. UI Updates iniciales
            chatInput.value = '';
            if (!welcomeScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatMessages.classList.remove('hidden');
            }

            // 2. Mensaje del Usuario
            appendMessage(texto, 'usuario');

            // 3. Crear contenedor del Bot e iniciar animación de "Pensando"
            const botMsgId = createBotContainer();
            const botTextContainer = document.getElementById(botMsgId);
            botTextContainer.innerHTML = `<span class="flex items-center gap-2 text-gray-500 text-[10px] uppercase font-bold tracking-widest"><div class="w-3 h-3 border-2 border-gray-500 border-t-[#FFC300] rounded-full animate-spin"></div> Analizando biometría...</span>`;
            scrollToBottom();

            try {
                // 4. Llamada al Backend (Con Autenticación)
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        ...getBearerToken()
                    },
                    body: JSON.stringify({ mensaje: texto })
                });

                const data = await response.json();

                if (response.status === 401 || response.status === 403) {
                    botTextContainer.innerHTML = `<span class="text-red-400">⚠️ ${data.error || 'Acceso denegado.'}</span>`;
                    return;
                }

                if(data.respuesta) {
                    // Iniciar efecto máquina de escribir
                    await simulateNaturalTyping(botTextContainer, data.respuesta);
                } else {
                    botTextContainer.innerHTML = `<span class="text-red-400">Fallo en la matriz de respuesta. Inténtalo de nuevo.</span>`;
                }

            } catch (error) {
                console.error(error);
                botTextContainer.innerHTML = `<span class="text-red-400">Error de conexión con el núcleo. Verifica tu red.</span>`;
            }
        }

        // ==========================================
        // ESCRITURA NATURAL (TYPEWRITER PREMIUM)
        // ==========================================
        async function simulateNaturalTyping(element, rawText) {
            element.innerHTML = ''; // Limpiar el "Pensando..."
            element.classList.add('typing-cursor');

            // 1. Formatear Markdown básico a HTML
            let htmlText = rawText
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                .replace(/\n/g, '<br/>')
                .replace(/- (.*)/g, '<li class="ml-4 list-disc marker:text-[#FFC300]">$1</li>');

            // 2. Dividir por etiquetas HTML para no romperlas durante la escritura
            const parts = htmlText.split(/(<[^>]+>)/g);
            let currentContent = '';

            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (!part) continue;

                if (part.startsWith('<')) {
                    // Si es una etiqueta HTML, la insertamos completa al instante
                    currentContent += part;
                    element.innerHTML = currentContent;
                } else {
                    // Si es texto, lo tipeamos carácter por carácter
                    for (let j = 0; j < part.length; j++) {
                        currentContent += part[j];
                        element.innerHTML = currentContent;
                        scrollToBottom();
                        
                        // Retardo natural (Rápido para espacios, variable para letras)
                        const delay = part[j] === ' ' ? 5 : (Math.random() * 15 + 5); 
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
            }
            // Eliminar el cursor parpadeante al terminar
            element.classList.remove('typing-cursor');
        }

        // ==========================================
        // RENDERIZADO DE BURBUJAS UI
        // ==========================================
        function appendMessage(texto, emisor) {
            const div = document.createElement('div');
            div.className = 'w-full flex msg-animate';

            if(emisor === 'usuario') {
                div.classList.add('justify-end');
                div.innerHTML = `
                    <div class="max-w-[85%] md:max-w-[70%] bg-gradient-to-br from-[#FFC300] to-[#eab308] text-black font-semibold rounded-[24px] rounded-tr-sm p-4 md:p-5 shadow-[0_10px_20px_rgba(255,195,0,0.15)] text-xs md:text-sm leading-relaxed">
                        ${texto}
                    </div>
                `;
                chatMessages.appendChild(div);
                scrollToBottom();
            }
        }

        // Crea la burbuja vacía del bot y devuelve el ID del contenedor de texto
        function createBotContainer() {
            const div = document.createElement('div');
            const textContainerId = 'bot-text-' + Math.random().toString(36).substr(2, 9);
            div.className = 'w-full flex msg-animate justify-start';

            div.innerHTML = `
                <div class="flex gap-3 md:gap-4 max-w-[90%] md:max-w-[80%]">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-[#111] border border-white/10 flex items-center justify-center flex-shrink-0 mt-1 shadow-lg shadow-black">
                        <svg class="w-4 h-4 md:w-5 md:h-5 text-[#FFC300]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div class="glass-panel text-gray-300 rounded-[24px] rounded-tl-sm p-5 md:p-6 shadow-xl leading-relaxed text-xs md:text-sm font-medium border-t border-t-white/10">
                        <div id="${textContainerId}"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            return textContainerId;
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Eventos
        btnSend.addEventListener('click', () => enviarMensaje());
        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') enviarMensaje();
        });

        // Verificación de sesión inicial
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('gymen_auth_token');
            if(!token) {
                alert("Debes iniciar sesión para acceder al Copiloto.");
                window.location.href = '/apps/start/login.html';
            }
        });
    </script>
</body>
</html>
