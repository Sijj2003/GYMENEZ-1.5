<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | Pulse Center</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030305; 
            color: #ffffff;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(15px);
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black">

    <div class="fixed inset-0 bg-gradient-to-b from-[#030305] via-[#050508] to-[#030305] -z-10"></div>
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-sky-950/10 via-transparent to-transparent -z-10"></div>

    <div class="min-h-screen w-full flex flex-col max-w-xl mx-auto px-4 py-6">
        
        <header class="flex items-center justify-between mb-8 fade-in-up">
            <button onclick="window.location.href='/apps/start/inicio.html'" class="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-gray-400 hover:text-white transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
                Volver al Hub
            </button>
            <span class="text-[10px] font-black uppercase tracking-[0.3em] text-[#FFC300] font-mono bg-[#FFC300]/5 px-3 py-1 rounded-full border border-[#FFC300]/10">Pulse Box</span>
        </header>

        <main class="flex-grow">
            <div class="mb-8 fade-in-up" style="animation-delay: 0.1s;">
                <h2 class="text-3xl font-black uppercase tracking-tighter leading-none">Centro de <span class="text-sky-400">Comandos</span></h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mt-2 font-mono">Monitoreo y transmisiones directas del Staff</p>
            </div>

            <div id="pulse-page-container" class="space-y-4 fade-in-up" style="animation-delay: 0.2s;"></div>
        </main>

        <footer class="text-center py-8 border-t border-white/5 mt-12 fade-in-up" style="animation-delay: 0.3s;">
            <p class="text-[8px] font-bold uppercase tracking-[0.4em] text-gray-600">© 2026 GYMENEZ PERFORMANCE • PULSE MODULE</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('pulse-page-container');
            if (!container) return;

            // ⚡ Leemos directo de la memoria local a velocidad luz
            const cachedData = localStorage.getItem('gymen_pulse_cache');
            
            if (!cachedData) {
                container.innerHTML = `
                    <div class="glass-panel rounded-3xl p-8 text-center border border-white/5">
                        <span class="text-2xl block mb-2">⚡</span>
                        <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest font-mono">PULSO EN ESTABILIDAD</h4>
                        <p class="text-xs text-gray-500 mt-1 max-w-xs mx-auto">No tienes transmisiones ni directrices pendientes por el comando técnico en este momento.</p>
                    </div>
                `;
                return;
            }

            const alerts = JSON.parse(cachedData);
            container.innerHTML = '';

            alerts.forEach((alert, index) => {
                let cardTemplate = '';
                const delay = (index * 0.1).toFixed(1);

                switch(alert.category) {
                    case 'COACH_AUDIT':
                        cardTemplate = `
                            <div class="glass-panel rounded-3xl p-6 border border-red-500/30 bg-gradient-to-r from-red-950/10 to-transparent shadow-[0_0_30px_rgba(220,38,38,0.05)] fade-in-up" style="animation-delay: ${delay}s">
                                <div class="flex items-start gap-4">
                                    <div class="w-8 h-8 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center text-sm">🚨</div>
                                    <div class="flex-1">
                                        <h4 class="text-xs font-black text-red-400 uppercase tracking-wider font-mono">${alert.title}</h4>
                                        <p class="text-xs text-gray-200 mt-2 leading-relaxed font-medium">${alert.content}</p>
                                        <div class="text-[9px] text-red-500/60 font-black mt-4 uppercase tracking-widest font-mono">⚠️ INSTRUCCIÓN CRÍTICA DE ASESORÍA VIP</div>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;

                    case 'PROMO':
                        cardTemplate = `
                            <div class="glass-panel rounded-3xl p-6 border border-[#FFC300]/30 bg-gradient-to-br from-yellow-500/5 to-transparent shadow-xl fade-in-up" style="animation-delay: ${delay}s">
                                <div class="flex items-start gap-4">
                                    <div class="w-8 h-8 rounded-full bg-[#FFC300]/10 border border-[#FFC300]/20 flex items-center justify-center text-sm">👑</div>
                                    <div class="flex-1">
                                        <h4 class="text-xs font-black text-[#FFC300] uppercase tracking-wider font-mono">${alert.title}</h4>
                                        <p class="text-xs text-gray-300 mt-2 leading-relaxed font-medium">${alert.content}</p>
                                        <button onclick="window.location.href='/apps/user/checkout.html'" class="mt-4 bg-[#FFC300] hover:bg-yellow-400 text-black font-black text-[10px] uppercase tracking-widest px-5 py-2.5 rounded-xl transition-all duration-200 shadow-[0_0_15px_rgba(255,195,0,0.15)]">
                                            ACTIVAR ACCESO ÉLITE
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;

                    case 'PLUS_INFO':
                    case 'PLAN_INFO':
                        cardTemplate = `
                            <div class="glass-panel rounded-3xl p-5 border border-blue-500/20 bg-gradient-to-r from-blue-950/5 to-transparent shadow-md fade-in-up" style="animation-delay: ${delay}s">
                                <div class="flex items-start gap-4">
                                    <div class="w-8 h-8 rounded-full bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-sm">💎</div>
                                    <div class="flex-1">
                                        <h4 class="text-xs font-black text-blue-400 uppercase tracking-wide font-mono">${alert.title}</h4>
                                        <p class="text-xs text-gray-300 mt-1.5 leading-relaxed font-medium">${alert.content}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;

                    default:
                        cardTemplate = `
                            <div class="glass-panel rounded-3xl p-5 border border-white/5 hover:border-white/10 transition-colors duration-300 fade-in-up" style="animation-delay: ${delay}s">
                                <div class="flex items-start gap-4">
                                    <div class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-sm">📢</div>
                                    <div class="flex-1">
                                        <h4 class="text-xs font-bold text-white uppercase tracking-tight">${alert.title}</h4>
                                        <p class="text-xs text-gray-400 mt-1.5 leading-relaxed">${alert.content}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                }
                container.insertAdjacentHTML('beforeend', cardTemplate);
            });
        });
    </script>
</body>
</html>
