<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ CORE | Gestión de Usuarios</title>
    <link rel="icon" type="image/png" href="mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/admin_auth.css">
    <style>
        .admin-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .admin-table th { padding: 12px 16px; text-align: left; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: #6b7280; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-table td { padding: 16px; background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.2s; }
        .admin-table tr:hover td { background: rgba(255,255,255,0.05); }
        .admin-table td:first-child { border-left: 1px solid rgba(255,255,255,0.02); border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
        .admin-table td:last-child { border-right: 1px solid rgba(255,255,255,0.02); border-top-right-radius: 16px; border-bottom-right-radius: 16px; }
        
        .modal-glass { background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-[#030305] text-white selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 md:px-6 py-2 md:py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center border border-white/10"></div>

    <div class="fixed inset-0 bg-[url('../../static/img/backgrounds/PROFILE_FONDO.png')] bg-cover bg-center opacity-10 -z-10 mix-blend-screen grayscale"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/50 via-[#030305]/90 to-[#030305] -z-10"></div>

    <header class="w-full border-b border-white/5 bg-black/30 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-[#FFC300] rounded-full shadow-[0_0_10px_#FFC300] animate-pulse"></div>
                <h1 class="text-lg md:text-xl font-black uppercase tracking-tighter block">
                    GYMENEZ <span class="text-white">CORE</span>
                </h1>
            </div>
            <a href="inicio.html" class="px-4 py-2 md:px-6 md:py-2 rounded-full border border-white/10 text-white font-bold text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                Volver a Consola
            </a>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto w-full px-4 md:px-6 py-8 md:py-10 flex-grow animate-premium-in">
        
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <p class="text-gray-500 text-[9px] md:text-[10px] font-black uppercase tracking-[0.4em] mb-1">Directorio de Atletas</p>
                <h2 class="text-3xl sm:text-4xl md:text-5xl font-black uppercase tracking-tighter leading-none">
                    Gestión de <span class="text-[#FFC300]">Usuarios.</span>
                </h2>
            </div>
            <button onclick="openModalForCreate()" class="px-5 py-3 rounded-xl bg-[#FFC300] text-black text-[9px] font-black uppercase tracking-widest hover:bg-yellow-400 transition shadow-[0_0_20px_rgba(255,195,0,0.2)] flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Nuevo Atleta
            </button>
        </div>

        <div class="glass-panel p-4 md:p-8 rounded-[24px] md:rounded-[32px]">
            <div class="mb-6">
                <input type="text" id="user-search-input" placeholder="Buscar por Nombre, Email o Cédula..." 
                       class="w-full glass-input px-5 py-4 rounded-xl text-white text-xs md:text-sm font-medium">
            </div>

            <div class="overflow-x-auto no-scrollbar">
                <table class="admin-table min-w-[800px]">
                    <thead>
                        <tr>
                            <th>Atleta</th>
                            <th>Contacto</th>
                            <th>Membresía</th>
                            <th>Status</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="user-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-[5000] flex items-center justify-center p-4 transition-opacity">
        <div class="modal-glass w-full max-w-2xl p-6 md:p-10 rounded-[24px] md:rounded-[32px] max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                <div>
                    <h3 id="modal-title" class="text-xl md:text-2xl font-black text-white uppercase tracking-tighter">Añadir Atleta</h3>
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold mt-1">Ficha Técnica en Núcleo</p>
                </div>
                <button onclick="closeModalSafe('user-modal')" class="text-gray-500 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="user-form" class="space-y-5">
                <input type="hidden" id="user-id-field" name="id">
                <input type="hidden" id="is-edit-mode" value="false">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Nombre</label>
                        <input type="text" id="name" name="name" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs uppercase">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Apellido</label>
                        <input type="text" id="last_name" name="last_name" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs uppercase">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Email</label>
                        <input type="email" id="email" name="email" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Contraseña <span id="password-req" class="text-[#FFC300]">*</span></label>
                        <input type="password" id="password" name="password" class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Cédula</label>
                        <div class="flex gap-2">
                            <select id="id_number_prefix" name="id_number_prefix" class="w-16 glass-input px-2 py-3 rounded-xl text-white text-xs font-bold text-center appearance-none"><option value="V">V</option><option value="E">E</option></select>
                            <input type="text" id="id_number" name="id_number" required class="flex-1 glass-input px-4 py-3 rounded-xl text-white text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Teléfono</label>
                        <div class="flex gap-2">
                            <select id="phone_prefix" name="phone_prefix" class="w-20 glass-input px-2 py-3 rounded-xl text-white text-xs font-bold text-center appearance-none"><option value="0414">0414</option><option value="0424">0424</option><option value="0412">0412</option><option value="0422">0422</option><option value="0416">0416</option><option value="0426">0426</option></select>
                            <input type="text" id="phone_number_body" name="phone_number_body" required class="flex-1 glass-input px-4 py-3 rounded-xl text-white text-xs">
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 border-t border-white/5 pt-5 mt-2">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Suscripción</label>
                        <select id="subscription_level" name="subscription_level" class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs font-bold appearance-none">
                            <option value="BASICO">BÁSICO</option>
                            <option value="STANDARD">STANDARD</option>
                            <option value="PLUS">PLUS</option>
                            <option value="ULTRA" class="text-[#FFC300]">ULTRA</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Activo Desde</label>
                        <input type="date" id="activo_desde" name="activo_desde" class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Sexo</label>
                        <select id="sex" name="sex" class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs font-bold appearance-none"><option value="Hombre">Hombre</option><option value="Mujer">Mujer</option></select>
                    </div>
                </div>

                <div class="pt-6 mt-4">
                    <button type="submit" id="submit-btn" class="w-full btn-gold py-4 rounded-xl font-black text-[10px] uppercase tracking-widest">
                        Guardar Ficha
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../static/js/admin_auth.js"></script>
    <script>
        // 🚀 DETECTOR INTELIGENTE DE ENTORNO PERIMETRAL
        const isLocalhost = window.location.hostname === '127.0.0.1' || 
                            window.location.hostname === 'localhost' || 
                            window.location.protocol === 'file:';

        const API_URL = isLocalhost ? 'http://127.0.0.1:5000' : 'https://sijj2003.pythonanywhere.com';
        let allUsersData = [];

        function formatToUpperCase(inputString) { return inputString ? inputString.toUpperCase().trim() : ''; }
        
        function formatIdNumber(value) {
            const digits = value.replace(/\D/g, '');
            if (digits.length === 0) return '';
            let formatted = '';
            let count = 0;
            for (let i = digits.length - 1; i >= 0; i--) {
                formatted = digits[i] + formatted;
                count++;
                if (count % 3 === 0 && i !== 0) formatted = '.' + formatted;
            }
            return formatted;
        }

        async function fetchAllUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10"><div class="w-6 h-6 border-2 border-white/20 border-t-[#FFC300] rounded-full animate-spin mx-auto"></div></td></tr>';
            
            try {
                const res = await fetch(`${API_URL}/api/admin/users`);
                const data = await res.json();
                
                if (data.success) {
                    allUsersData = data.users; 
                    renderUsersTable(allUsersData);
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-400 text-xs font-bold">${data.error}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-red-400 text-xs font-bold uppercase tracking-widest">Error de conexión con el núcleo.</td></tr>';
            }
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = ''; 

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-gray-500 text-xs font-bold uppercase tracking-widest">No hay atletas registrados</td></tr>`;
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                const subColor = (user.subscription_level === 'ULTRA') ? 'text-[#FFC300]' : (user.subscription_level === 'PLUS' ? 'text-emerald-400' : 'text-gray-300');
                const isBlocked = user.is_blocked;

                tr.innerHTML = `
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center font-black text-[10px]">${user.full_name ? user.full_name[0] : 'U'}</div>
                            <div>
                                <p class="text-xs font-bold text-white">${user.full_name}</p>
                                <p class="text-[9px] font-black text-gray-500 tracking-widest uppercase">${user.id_number}</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <p class="text-[10px] text-gray-300">${user.email}</p>
                        <p class="text-[9px] text-gray-500">${user.phone_number || 'N/A'}</p>
                    </td>
                    <td>
                        <span class="px-2 py-1 rounded bg-white/5 border border-white/5 text-[9px] font-black uppercase tracking-widest ${subColor}">
                            ${user.subscription_level || 'BÁSICO'}
                        </span>
                    </td>
                    <td>
                        <span class="px-2 py-1 rounded text-[9px] font-black uppercase tracking-widest ${isBlocked ? 'bg-red-500/20 text-red-400 border border-red-500/20' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/20'}">
                            ${isBlocked ? 'Bloqueado' : 'Activo'}
                        </span>
                    </td>
                    <td class="text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick='handleBlockUser("${user.id}", ${isBlocked})' class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center transition ${isBlocked ? 'text-emerald-400' : 'text-red-400'}">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </button>
                            <button onclick='openModalForEdit(${JSON.stringify(user).replace(/'/g, "&#39;")})' class="w-7 h-7 rounded-lg bg-white/5 hover:bg-[#FFC300]/20 hover:text-[#FFC300] flex items-center justify-center transition text-gray-400">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick='deleteUser("${user.id}", "${user.full_name}")' class="w-7 h-7 rounded-lg bg-white/5 hover:bg-red-500/20 hover:text-red-400 flex items-center justify-center transition text-gray-400">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Buscador reactivo
        document.getElementById('user-search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (!term) return renderUsersTable(allUsersData);
            const filtered = allUsersData.filter(u => 
                (u.full_name||'').toLowerCase().includes(term) || 
                (u.email||'').toLowerCase().includes(term) || 
                (u.id_number||'').includes(term)
            );
            renderUsersTable(filtered);
        });

        // Formato ID en tiempo real
        document.getElementById('id_number').addEventListener('input', function() {
            const oldVal = this.value;
            const raw = oldVal.replace(/\D/g, '');
            this.value = formatIdNumber(raw);
        });

        // Modales
        function closeModalSafe(id) { document.getElementById(id).classList.add('hidden'); }
        
        function openModalForCreate() {
            document.getElementById('user-form').reset();
            document.getElementById('modal-title').textContent = 'Añadir Atleta';
            document.getElementById('is-edit-mode').value = 'false';
            document.getElementById('email').disabled = false;
            document.getElementById('password').required = true;
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function openModalForEdit(user) {
            document.getElementById('user-form').reset();
            document.getElementById('modal-title').textContent = 'Editar Atleta';
            document.getElementById('user-id-field').value = user.id;
            document.getElementById('is-edit-mode').value = 'true';
            
            document.getElementById('name').value = user.name || '';
            document.getElementById('last_name').value = user.last_name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('email').disabled = true;
            document.getElementById('password').required = false;
            
            document.getElementById('subscription_level').value = user.subscription_level || 'STANDARD';
            
            if (user.id_number && user.id_number.includes('-')) {
                const [pref, num] = user.id_number.split('-');
                document.getElementById('id_number_prefix').value = pref;
                document.getElementById('id_number').value = formatIdNumber(num);
            }
            if (user.phone_number && user.phone_number.includes('-')) {
                const [pref, num] = user.phone_number.split('-');
                document.getElementById('phone_prefix').value = pref;
                document.getElementById('phone_number_body').value = num;
            }
            
            document.getElementById('user-modal').classList.remove('hidden');
        }

        // 🔥 CORRECCIÓN: Envío del formulario con Content-Type correcto y Fetch dinámico
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const isEdit = document.getElementById('is-edit-mode').value === 'true';
            const id = document.getElementById('user-id-field').value;

            const payload = {
                name: formatToUpperCase(form.name.value),
                last_name: formatToUpperCase(form.last_name.value),
                id_number: `${form.id_number_prefix.value}-${formatIdNumber(form.id_number.value)}`,
                phone_number: `${form.phone_prefix.value}-${form.phone_number_body.value.replace(/\D/g, '')}`,
                subscription_level: form.subscription_level.value,
                sex: form.sex.value
            };

            if (!isEdit) payload.email = form.email.value;
            if (form.password.value) payload.password = form.password.value;
            if (form.activo_desde.value) payload.activo_desde = form.activo_desde.value;

            const url = isEdit ? `${API_URL}/api/admin/user/${id}` : `${API_URL}/api/admin/user`;
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'PROCESANDO...';

            try {
                const res = await fetch(url, { 
                    method: isEdit ? 'PUT' : 'POST', 
                    headers: { 'Content-Type': 'application/json' }, // Inyección de cabecera mandatoria
                    body: JSON.stringify(payload) 
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message || 'Operación exitosa', 'success');
                    closeModalSafe('user-modal');
                    fetchAllUsers();
                } else {
                    showMessage(data.error || 'Error al procesar la solicitud', 'error');
                }
            } catch(e) { 
                showMessage("Error de red", 'error'); 
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar Ficha';
            }
        });

        // 🔥 CORRECCIÓN: Bloqueo de usuarios con cabeceras correctas
        async function handleBlockUser(id, isBlocked) {
            if (!confirm(`¿${isBlocked ? 'Desbloquear' : 'Bloquear'} acceso a este usuario?`)) return;
            try {
                const res = await fetch(`${API_URL}/api/admin/user/block/${id}`, { 
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json' }, // Inyección de cabecera mandatoria
                    body: JSON.stringify({ is_blocked: !isBlocked }) 
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                    fetchAllUsers();
                } else {
                    showMessage(data.error || 'Error al modificar estado', 'error');
                }
            } catch(e) { 
                showMessage("Error de red al intentar bloquear", 'error'); 
            }
        }

        async function deleteUser(id, name) {
            if (!confirm(`¿Borrar permanentemente a ${name}? Esta acción purga su biometría.`)) return;
            try {
                const res = await fetch(`${API_URL}/api/admin/user/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                    fetchAllUsers();
                } else {
                    showMessage(data.error || 'Error al intentar eliminar', 'error');
                }
            } catch(e) { 
                showMessage("Error al borrar", 'error'); 
            }
        }

        window.addEventListener('DOMContentLoaded', fetchAllUsers);
    </script>
</body>
</html>
