    <script>
        // ----------------------------------------------------
        // LÓGICA DEL SHELL DE COMANDOS (Single Page Experience)
        // ----------------------------------------------------
        const homeDashboard = document.getElementById('home-dashboard');
        const moduleViewer = document.getElementById('module-viewer');
        const appFrame = document.getElementById('app-frame');
        const loader = document.getElementById('transition-loader');
        
        function setActiveNav(navId) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                el.classList.add('text-gray-400');
            });
            const activeEl = document.getElementById(navId);
            if(activeEl) {
                activeEl.classList.add('active');
                activeEl.classList.remove('text-gray-400');
            }
        }

        function goHome() {
            setActiveNav('nav-home');
            
            // Ocultar Visor, Mostrar Dashboard
            moduleViewer.classList.replace('viewer-visible', 'viewer-hidden');
            homeDashboard.style.opacity = '1';
            homeDashboard.style.transform = 'scale(1)';
            homeDashboard.style.pointerEvents = 'auto';
            
            // Limpiar iframe para liberar memoria
            setTimeout(() => { appFrame.src = 'about:blank'; }, 400);
        }

        function loadModule(url, navId) {
            setActiveNav(navId);
            
            // Mostrar Loader
            loader.classList.remove('hidden');
            setTimeout(() => loader.classList.remove('opacity-0'), 10);

            // Ocultar Dashboard
            homeDashboard.style.opacity = '0';
            homeDashboard.style.transform = 'scale(0.98)';
            homeDashboard.style.pointerEvents = 'none';

            // Cargar iframe
            appFrame.src = url;

            // Escuchar cuando el iframe termine de cargar
            appFrame.onload = function() {
                // Truco de UX: Forzar un ligero retraso para suavidad premium
                setTimeout(() => {
                    moduleViewer.classList.replace('viewer-hidden', 'viewer-visible');
                    loader.classList.add('opacity-0');
                    setTimeout(() => loader.classList.add('hidden'), 300);
                }, 400);
            };
        }

        // Interceptar clicks dentro del iframe si se quiere navegar a otra parte (Opcional)
        // Como el iframe carga la misma URL de origen, la seguridad no bloquea la comunicación.
        // Las páginas hijas seguirán funcionando igual ya que traen sus propios scripts.
        
    </script>
