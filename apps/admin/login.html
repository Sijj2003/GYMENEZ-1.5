<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | System Core Access</title>
    
    <link rel="icon" type="image/png" href="mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../static/css/admin_auth.css">
</head>
<body class="selection:bg-indigo-500 selection:text-white overflow-hidden bg-[#030305]">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center w-11/12 max-w-[350px]"></div>

    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070" class="w-full h-full object-cover opacity-20 mix-blend-luminosity grayscale" alt="System Core">
        <div class="absolute inset-0 bg-gradient-to-b from-[#030305]/80 via-[#030305]/50 to-[#030305]"></div>
        <div class="absolute top-1/4 -left-20 w-96 h-96 bg-indigo-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-blue-600/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 min-h-screen w-full flex items-center justify-center p-4 md:p-6">
        <div class="glass-panel p-8 md:p-12 w-full max-w-md mx-auto rounded-[32px] border-t border-indigo-500/30 shadow-[0_0_50px_rgba(99,102,241,0.1)]">
            
            <div class="text-center mb-10">
                <div class="w-16 h-16 mx-auto bg-indigo-500/10 rounded-2xl flex items-center justify-center border border-indigo-500/20 mb-4">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase mb-1">System Core</h1>
                <p class="text-indigo-400 text-[9px] font-black uppercase tracking-[0.4em]">Personal Autorizado Únicamente</p>
            </div>

            <form id="admin-login-form" class="space-y-6">
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Terminal ID (Correo)</label>
                    <input type="email" id="login-email" class="w-full glass-input px-4 py-3.5 rounded-xl text-white text-sm" placeholder="admin@gymenez.com" required>
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Llave de Seguridad</label>
                    <input type="password" id="login-password" class="w-full glass-input px-4 py-3.5 rounded-xl text-white text-sm" placeholder="••••••••" required>
                </div>

                <div class="pt-4">
                    <button type="submit" id="login-button" class="btn-admin w-full py-4 rounded-xl font-black text-[10px] uppercase tracking-[0.3em] text-white shadow-lg">
                        Verificar Credenciales
                    </button>
                </div>
            </form>
            
            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-[8px] text-gray-600 uppercase tracking-widest font-bold flex items-center justify-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Servidor Conectado
                </p>
            </div>
        </div>
    </div>

    <script src="../../static/js/admin_auth.js"></script>
</body>
</html>
