<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | System Core</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/admin_auth.css">
</head>
<body class="selection:bg-indigo-500 selection:text-white overflow-hidden">

    <div id="message-box" class="fixed top-8 left-1/2 transform -translate-x-1/2 px-8 py-3 rounded-2xl text-[10px] font-black tracking-[0.3em] uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center min-w-[350px] border border-white/10 backdrop-blur-xl"></div>

    <div id="splash-screen" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-[#030305]">
        <div class="absolute inset-0 ambient-glow opacity-30"></div>
        <div class="text-center z-10 animate-premium-in">
            <img src="/static/img/logos/LOADING.png" alt="Core" class="w-32 md:w-40 mx-auto mb-8 opacity-80">
            <div class="flex items-center justify-center gap-3">
                <div class="w-1 h-1 bg-indigo-500 rounded-full animate-ping"></div>
                <div id="loading-text" class="text-[9px] font-black tracking-[1em] text-gray-500 uppercase">
                    Cargando Protocolos
                </div>
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden min-h-screen w-full flex items-center justify-center p-6 relative">
        <div class="absolute inset-0 bg-[url('/static/img/backgrounds/FONDO.png')] bg-cover bg-center opacity-40 grayscale mix-blend-luminosity"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-[#030305]/80 via-[#030305]/40 to-[#030305] pointer-events-none"></div>
        
        <div class="absolute top-1/4 -left-20 w-96 h-96 bg-indigo-600/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-blue-600/10 blur-[120px] rounded-full"></div>

        <div class="glass-panel p-10 md:p-16 w-full max-w-[480px] mx-auto rounded-[48px] relative z-10 border border-white/5">
            <div class="text-center mb-12">
                <img src="/static/img/logos/LOGIN_LOGO.png" alt="GYMENEZ" class="mx-auto w-40 mb-8 filter brightness-110">
                <div class="h-px w-12 bg-indigo-500 mx-auto mb-6"></div>
                <h2 class="text-white text-xs font-black uppercase tracking-[0.5em] mb-2">Internal System</h2>
                <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.2em]">Authorized Personnel Only</p>
            </div>

            <form id="admin-login-form" class="space-y-6">
                <div class="group">
                    <label class="block text-[9px] font-black text-gray-500 uppercase tracking-[0.3em] mb-2 ml-4 group-focus-within:text-indigo-400 transition-colors">Admin Terminal ID</label>
                    <input type="email" id="login-email" class="w-full glass-input px-6 py-5 rounded-[24px] text-white text-sm" placeholder="root@gymenez.com" required>
                </div>
                <div class="group">
                    <label class="block text-[9px] font-black text-gray-500 uppercase tracking-[0.3em] mb-2 ml-4 group-focus-within:text-indigo-400 transition-colors">Security Key</label>
                    <input type="password" id="login-password" class="w-full glass-input px-6 py-5 rounded-[24px] text-white text-sm" placeholder="••••••••" required>
                </div>

                <div class="pt-6">
                    <button type="submit" id="login-button" class="btn-admin w-full py-5 rounded-[24px] font-black text-[10px] uppercase tracking-[0.4em] text-white shadow-2xl">
                        Verificar Credenciales
                    </button>
                </div>
            </form>
            
            <div class="mt-12 pt-8 border-t border-white/5 flex flex-col gap-6 text-center">
                <button id="forgot-password-link" class="text-[9px] font-black text-gray-500 hover:text-white transition uppercase tracking-[0.2em]">
                    ¿Olvidó su llave de acceso?
                </button>
                <button id="return-to-client-login" class="text-[9px] font-black text-indigo-400/60 hover:text-indigo-400 transition uppercase tracking-[0.2em]">
                    ← Volver a Plataforma de Atletas
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-container" class="hidden min-h-screen bg-[#030305]"></div>

    <script src="/static/js/admin_auth.js"></script>
</body>
</html>
