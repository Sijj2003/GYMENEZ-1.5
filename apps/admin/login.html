<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | System Administration</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/admin_auth.css">
</head>
<body class="selection:bg-indigo-500 selection:text-white">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-xs font-black tracking-[0.2em] uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center min-w-[320px]"></div>

    <div id="splash-screen" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center">
        <div class="absolute inset-0 ambient-glow opacity-40"></div>
        <div class="text-center z-10 animate-premium-in">
            <h1 class="text-4xl font-black tracking-tighter text-white mb-2">GYMENEZ <span class="text-indigo-500">CORE</span></h1>
            <div id="loading-text" class="text-[10px] font-black tracking-[0.8em] text-gray-500 uppercase animate-pulse">
                Iniciando Centro de Control
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden min-h-screen w-full flex items-center justify-center p-6 relative overflow-hidden">
        <div class="absolute inset-0 bg-[#050508] pointer-events-none"></div>
        <div class="ambient-glow opacity-20"></div>

        <div class="glass-panel p-10 md:p-14 w-full max-w-md mx-auto rounded-[40px] relative z-10 border-t border-white/10">
            <div class="text-center mb-12">
                <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 mb-6">
                    <span class="text-[9px] font-black text-indigo-400 uppercase tracking-[0.4em]">Secure Access Protocol</span>
                </div>
                <h2 class="text-3xl font-black text-white tracking-tighter uppercase mb-2">Administración</h2>
                <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.2em]">Ingrese credenciales de nivel 1</p>
            </div>

            <form id="admin-login-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Terminal ID (Email)</label>
                    <input type="email" id="login-email" class="w-full glass-input px-5 py-4 rounded-2xl text-white text-sm" placeholder="admin@gymenez.com" required>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Security Key</label>
                    <input type="password" id="login-password" class="w-full glass-input px-5 py-4 rounded-2xl text-white text-sm" placeholder="••••••••" required>
                </div>

                <div class="pt-6">
                    <button type="submit" id="login-button" class="btn-admin w-full py-4 rounded-2xl font-black text-xs uppercase tracking-[0.3em] text-white">
                        Acceder al Sistema
                    </button>
                </div>
            </form>
            
            <div class="mt-10 pt-8 border-t border-white/5 flex flex-col gap-5 text-center">
                <button id="forgot-password-link" class="text-[10px] font-bold text-gray-500 hover:text-indigo-400 transition uppercase tracking-widest">
                    Solicitar Recuperación de Llave
                </button>
                <button id="return-to-client-login" class="text-[9px] font-bold text-gray-600 hover:text-white transition uppercase tracking-[0.2em]">
                    ← Volver a Portal Atletas
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-container" class="hidden min-h-screen bg-[#030305]"></div>

    <script src="/static/js/admin_auth.js"></script>
</body>
</html>
