<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ CORE | Bóveda de Ejercicios</title>
    <link rel="icon" type="image/png" href="mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/admin_auth.css">
    <style>
        .admin-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .admin-table th { padding: 12px 16px; text-align: left; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: #6b7280; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-table td { padding: 16px; background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.2s; }
        .admin-table tr:hover td { background: rgba(255,255,255,0.05); }
        .admin-table td:first-child { border-left: 1px solid rgba(255,255,255,0.02); border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
        .admin-table td:last-child { border-right: 1px solid rgba(255,255,255,0.02); border-top-right-radius: 16px; border-bottom-right-radius: 16px; }
        
        .modal-glass { background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-[#030305] text-white selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 md:px-6 py-2 md:py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center border border-white/10"></div>

    <div class="fixed inset-0 bg-[url('../../static/img/backgrounds/PROFILE_FONDO.png')] bg-cover bg-center opacity-10 -z-10 mix-blend-screen grayscale"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/50 via-[#030305]/90 to-[#030305] -z-10"></div>

    <header class="w-full border-b border-white/5 bg-black/30 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-[#FFC300] rounded-full shadow-[0_0_10px_#FFC300] animate-pulse"></div>
                <h1 class="text-lg md:text-xl font-black uppercase tracking-tighter block">
                    GYMENEZ <span class="text-white">CORE</span>
                </h1>
            </div>
            <a href="inicio.html" class="px-4 py-2 md:px-6 md:py-2 rounded-full border border-white/10 text-white font-bold text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                Volver a Consola
            </a>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto w-full px-4 md:px-6 py-8 md:py-10 flex-grow animate-premium-in">
        
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <p class="text-gray-500 text-[9px] md:text-[10px] font-black uppercase tracking-[0.4em] mb-1">Biblioteca Audiovisual</p>
                <h2 class="text-3xl sm:text-4xl md:text-5xl font-black uppercase tracking-tighter leading-none">
                    Bóveda de <span class="text-[#FFC300]">Ejercicios.</span>
                </h2>
            </div>
            <div class="flex gap-3">
                <a href="admin_routines_creator.html" class="px-5 py-3 rounded-xl border border-white/10 text-white text-[9px] font-black uppercase tracking-widest hover:bg-white/10 transition flex items-center gap-2">
                    Constructor de Rutinas
                </a>
                <button onclick="openModalForCreate()" class="px-5 py-3 rounded-xl bg-[#FFC300] text-black text-[9px] font-black uppercase tracking-widest hover:bg-yellow-400 transition shadow-[0_0_20px_rgba(255,195,0,0.2)] flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Añadir Ejercicio
                </button>
            </div>
        </div>

        <div class="glass-panel p-4 md:p-8 rounded-[24px] md:rounded-[32px]">
            <div class="mb-6">
                <input type="text" id="exercise-search-input" placeholder="Buscar por Nombre, Descripción o Patrón Biomecánico..." 
                       class="w-full glass-input px-5 py-4 rounded-xl text-white text-xs md:text-sm font-medium">
            </div>

            <div class="overflow-x-auto no-scrollbar">
                <table class="admin-table min-w-[800px]">
                    <thead>
                        <tr>
                            <th>Ejercicio</th>
                            <th>Ficha Biomecánica & Descripción</th>
                            <th>Media</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="exercises-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="exercise-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-[5000] flex items-center justify-center p-4 transition-opacity">
        <div class="modal-glass w-full max-w-3xl p-6 md:p-10 rounded-[24px] md:rounded-[32px] max-h-[95vh] overflow-y-auto no-scrollbar">
            
            <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                <div>
                    <h3 id="modal-title" class="text-xl md:text-2xl font-black text-white uppercase tracking-tighter">Añadir Ejercicio</h3>
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold mt-1">Diccionario Técnico Biomecánico</p>
                </div>
                <button onclick="closeModalSafe('exercise-modal')" class="text-gray-500 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="exercise-form" class="space-y-6">
                <input type="hidden" id="exercise-id-field" name="id">
                <input type="hidden" id="is-edit-mode" value="false">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-white/5 pb-6">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Nombre Oficial del Ejercicio <span class="text-[#FFC300]">*</span></label>
                        <input type="text" id="name" name="name" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs uppercase font-bold" placeholder="Ej: Press de Banca Inclinado">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Enlace del Tutorial (YouTube) <span class="text-gray-600">(Opcional)</span></label>
                        <input type="url" id="link_tutorial" name="link_tutorial" class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs" placeholder="https://youtube.com/watch?v=...">
                    </div>
                </div>

                <div>
                    <h4 class="text-[10px] font-black text-[#FFC300] uppercase tracking-widest mb-4">Clasificación Algorítmica</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Tier (Estabilidad) <span class="text-[#FFC300]">*</span></label>
                            <select id="tier" name="tier" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs font-bold appearance-none cursor-pointer">
                                <option value="1">Tier 1 - Peso Libre / Inestable</option>
                                <option value="2">Tier 2 - Máquinas Compuestas</option>
                                <option value="3">Tier 3 - Aislamiento Específico</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Patrón de Movimiento <span class="text-[#FFC300]">*</span></label>
                            <select id="movement_pattern" name="movement_pattern" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs font-bold appearance-none cursor-pointer">
                                <option value="EMPUJE_HORIZONTAL">Empuje Horizontal</option>
                                <option value="EMPUJE_VERTICAL">Empuje Vertical</option>
                                <option value="TRACCION_HORIZONTAL">Tracción Horizontal</option>
                                <option value="TRACCION_VERTICAL">Tracción Vertical</option>
                                <option value="DOMINANTE_DE_RODILLA">Dominante de Rodilla</option>
                                <option value="DOMINANTE_DE_CADERA">Dominante de Cadera</option>
                                <option value="AISLAMIENTO">Aislamiento / Monarticular</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Equipamiento Base <span class="text-[#FFC300]">*</span></label>
                            <select id="equipment" name="equipment" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs font-bold appearance-none cursor-pointer">
                                <option value="BARRA">Barra</option>
                                <option value="MANCUERNAS">Mancuernas</option>
                                <option value="POLEA_MAQUINA">Polea / Máquina</option>
                                <option value="PESO_CORPORAL">Peso Corporal</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Instrucciones de Ejecución <span class="text-[#FFC300]">*</span></label>
                    <textarea id="description" name="description" rows="3" required class="w-full glass-input px-4 py-3 rounded-xl text-white text-xs" placeholder="Cadencia, enfoque y tips de postura..."></textarea>
                </div>

                <div class="pt-6 mt-4 border-t border-white/5">
                    <button type="submit" id="submit-btn" class="w-full btn-gold py-4 rounded-xl font-black text-[10px] uppercase tracking-widest">
                        Guardar en la Bóveda
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../static/js/admin_auth.js"></script>
    
    <script>
        let allExercisesData = [];

        async function fetchAllExercises() {
            const tbody = document.getElementById('exercises-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10"><div class="w-6 h-6 border-2 border-white/20 border-t-[#FFC300] rounded-full animate-spin mx-auto"></div></td></tr>';
            
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/exercises`);
                const data = await res.json();
                
                if (data.success) {
                    allExercisesData = data.exercises; 
                    renderExercisesTable(allExercisesData);
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-400 text-xs font-bold uppercase tracking-widest">${data.error}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-400 text-xs font-bold uppercase tracking-widest">Error de conexión con el núcleo.</td></tr>';
            }
        }

        function renderExercisesTable(exercises) {
            const tbody = document.getElementById('exercises-table-body');
            tbody.innerHTML = ''; 

            if (exercises.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-gray-500 text-xs font-bold uppercase tracking-widest">No hay ejercicios registrados</td></tr>`;
                return;
            }

            exercises.forEach(exercise => {
                const tr = document.createElement('tr');
                const desc = exercise.description || 'Sin descripción';
                const shortDesc = desc.length > 60 ? desc.substring(0, 60) + '...' : desc;
                
                let linkHTML = `<span class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">NO DISPONIBLE</span>`;
                if (exercise.link_tutorial) {
                    linkHTML = `<a href="${exercise.link_tutorial}" target="_blank" class="inline-flex items-center gap-1 text-[9px] font-black uppercase tracking-widest text-[#FFC300] hover:text-white transition bg-[#FFC300]/10 px-2.5 py-1 rounded border border-[#FFC300]/20"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M4.5 3.5v13L16 10 4.5 3.5z"/></svg> Reproducir</a>`;
                }

                // 🔥 Renderizado visual de las variables Biomecánicas
                const tierVal = parseInt(exercise.tier) || 1;
                let tierColor = tierVal === 1 ? 'text-red-400' : (tierVal === 2 ? 'text-yellow-400' : 'text-emerald-400');
                let patternDisplay = (exercise.movement_pattern || 'No Definido').replace(/_/g, ' ');
                let equipDisplay = exercise.equipment || 'No Definido';

                tr.innerHTML = `
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-[#FFC300] flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                            </div>
                            <p class="text-[11px] font-black text-white uppercase tracking-tighter">${exercise.name}</p>
                        </div>
                    </td>
                    <td>
                        <div class="mb-2 flex flex-wrap gap-2 text-[8px] font-black uppercase tracking-widest bg-black/40 p-1.5 rounded-lg border border-white/5 w-max">
                            <span class="${tierColor}">Tier ${tierVal}</span> 
                            <span class="text-gray-600">|</span> 
                            <span class="text-sky-400">${patternDisplay}</span> 
                            <span class="text-gray-600">|</span> 
                            <span class="text-white">${equipDisplay}</span>
                        </div>
                        <p class="text-[10px] text-gray-400 font-medium leading-relaxed">${shortDesc}</p>
                    </td>
                    <td>
                        ${linkHTML}
                    </td>
                    <td class="text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick='openModalForEdit(${JSON.stringify(exercise).replace(/'/g, "&#39;")})' class="w-7 h-7 rounded-lg bg-white/5 hover:bg-[#FFC300]/20 hover:text-[#FFC300] flex items-center justify-center transition text-gray-400">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick='deleteExercise("${exercise.id}", "${exercise.name}")' class="w-7 h-7 rounded-lg bg-white/5 hover:bg-red-500/20 hover:text-red-400 flex items-center justify-center transition text-gray-400">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Búsqueda en tiempo real
        document.getElementById('exercise-search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (!term) return renderExercisesTable(allExercisesData);
            const filtered = allExercisesData.filter(ex => 
                (ex.name||'').toLowerCase().includes(term) || 
                (ex.description||'').toLowerCase().includes(term) ||
                (ex.movement_pattern||'').toLowerCase().includes(term)
            );
            renderExercisesTable(filtered);
        });

        // Control de Modales
        function closeModalSafe(id) { document.getElementById(id).classList.add('hidden'); }
        
        function openModalForCreate() {
            document.getElementById('exercise-form').reset();
            document.getElementById('modal-title').textContent = 'Añadir Ejercicio';
            document.getElementById('is-edit-mode').value = 'false';
            
            // Valores por defecto
            document.getElementById('tier').value = '1';
            document.getElementById('movement_pattern').value = 'EMPUJE_HORIZONTAL';
            document.getElementById('equipment').value = 'BARRA';

            document.getElementById('exercise-modal').classList.remove('hidden');
        }

        function openModalForEdit(exercise) {
            document.getElementById('exercise-form').reset();
            document.getElementById('modal-title').textContent = 'Editar Ejercicio';
            document.getElementById('exercise-id-field').value = exercise.id;
            document.getElementById('is-edit-mode').value = 'true';
            
            document.getElementById('name').value = exercise.name || '';
            document.getElementById('link_tutorial').value = exercise.link_tutorial || '';
            document.getElementById('description').value = exercise.description || '';

            // Llenar variables Biomecánicas
            document.getElementById('tier').value = exercise.tier || '1';
            document.getElementById('movement_pattern').value = exercise.movement_pattern || 'EMPUJE_HORIZONTAL';
            document.getElementById('equipment').value = exercise.equipment || 'BARRA';
            
            document.getElementById('exercise-modal').classList.remove('hidden');
        }

        // Crear / Editar (POST / PUT)
        document.getElementById('exercise-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const isEdit = document.getElementById('is-edit-mode').value === 'true';
            const id = document.getElementById('exercise-id-field').value;

            // 🔥 PAYLOAD CON NUEVAS VARIABLES BIOMECÁNICAS
            const payload = {
                name: form.name.value.trim(),
                link_tutorial: form.link_tutorial.value.trim(),
                description: form.description.value.trim(),
                tier: parseInt(form.tier.value),
                movement_pattern: form.movement_pattern.value,
                equipment: form.equipment.value
            };

            const url = isEdit ? `${API_BASE_URL}/api/admin/exercise/${id}` : `${API_BASE_URL}/api/admin/exercise`;
            const method = isEdit ? 'PUT' : 'POST';
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = "PROCESANDO...";

            try {
                const res = await fetch(url, { 
                    method: method, 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage(data.message || "Bóveda actualizada con éxito.", "success");
                    closeModalSafe('exercise-modal');
                    fetchAllExercises();
                } else {
                    showMessage(data.error, "error");
                }
            } catch(err) { 
                showMessage("Fallo de red.", "error"); 
            } finally {
                btn.disabled = false; btn.textContent = "GUARDAR EN LA BÓVEDA";
            }
        });

        // Eliminar (DELETE)
        async function deleteExercise(id, name) {
            if (!confirm(`¿Estás seguro de eliminar el ejercicio: "${name}"? Esta acción no se puede deshacer.`)) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/exercise/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message || "Ejercicio purgado.", "success");
                    fetchAllExercises();
                } else {
                    showMessage(data.error, "error");
                }
            } catch(e) { 
                showMessage("Fallo al eliminar.", "error"); 
            }
        }

        // Iniciar
        window.addEventListener('DOMContentLoaded', fetchAllExercises);
    </script>
</body>
</html>
