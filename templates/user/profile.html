<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario | GYMENEZ</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="/static/css/user_pages.css">
    
    <script src="/static/js/profile.js" defer></script>
</head>
<body>

    <header class="p-6 flex justify-between items-center bg-black/20 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img src="/static/img/logos/mini_logo.png" alt="Logo" class="w-8 h-8">
            <h1 class="font-black text-xl tracking-tighter">PERFIL</h1>
        </div>
        <a href="../../index.html" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-sky-500/20 border border-white/10 transition font-bold text-xs">
            REGRESAR
        </a>
    </header>

    <div id="loading-spinner" class="flex flex-col items-center justify-center min-h-[60vh]">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-sky-400 mb-4"></div>
        <p class="text-gray-400 font-bold uppercase tracking-widest text-xs">Cargando datos...</p>
    </div>

    <main id="profile-content" class="hidden max-w-4xl mx-auto p-6 space-y-8 pb-20">
        
        <section class="glass-card p-8 flex flex-col md:flex-row items-center gap-8">
            <div class="relative">
                <div class="w-32 h-32 rounded-full border-4 border-sky-500/50 overflow-hidden bg-gray-900">
                    <img id="user-photo" src="/static/img/logos/LOADING.png" alt="User Photo" class="w-full h-full object-cover">
                </div>
            </div>
            <div class="text-center md:text-left">
                <h2 id="display-name" class="text-4xl font-black uppercase tracking-tighter italic">Nombre Usuario</h2>
                <p id="display-email" class="text-sky-400 font-mono text-sm">email@dominio.com</p>
                <div class="mt-4 flex gap-2 justify-center md:justify-start">
                    <span class="px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-[10px] font-black uppercase tracking-widest text-sky-400">Atleta</span>
                    <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-gray-400">Verificado</span>
                </div>
            </div> section>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-4 text-center">
                <p class="text-xs font-black text-gray-500 uppercase tracking-widest">Peso</p>
                <p id="stat-weight" class="text-2xl font-black text-white italic">-- kg</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-xs font-black text-gray-500 uppercase tracking-widest">Altura</p>
                <p id="stat-height" class="text-2xl font-black text-white italic">-- cm</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-xs font-black text-gray-500 uppercase tracking-widest">IMC</p>
                <p id="stat-imc" class="text-2xl font-black text-sky-400 italic">--</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-xs font-black text-gray-500 uppercase tracking-widest">Nivel</p>
                <p id="stat-level" class="text-2xl font-black text-white italic">PRO</p>
            </div>
        </div>

    </main>

</body>
</html>
